[build-system]
requires = [
    "setuptools>=77",
    "Cython>=3.0,<3.3; python_version < '3.14'",
    "Cython>=3.1.8,<3.3; python_version >= '3.14' and python_version < '3.15'",
    "Cython>=3.3.1,<3.4; python_version >= '3.15'",
    "numpy>=2.1.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "consenrich"
dynamic = ["version"]
description = "Genome-wide estimation of signals hidden in noisy multi-sample HTS datasets"
authors = [{ name="Nolan H. Hamilton", email="nolan.hamilton@unc.edu" }]
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE",
    "THIRD_PARTY_LICENSES.md",
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "ccounts>=0.5.0b0",
    "numpy>=2.1",
    "scipy>=1.15",
    "pandas>=2.3.0",
    "PyYAML>=6.0.2",
    "structlog>=25.5.0",
    "itrigamma>=0.2.0a1",
]

[project.optional-dependencies]
bigwig = ["pyBigWig>=0.3.24"]
plots = ["matplotlib>=3.8"]
memory = ["psutil>=5.9"]
singlecell = []
all = [
    "pyBigWig>=0.3.24",
    "matplotlib>=3.8",
    "psutil>=5.9",
]

[project.urls]
Documentation = "https://nolan-h-hamilton.github.io/Consenrich/"
Source = "https://github.com/nolan-h-hamilton/Consenrich"
Issues = "https://github.com/nolan-h-hamilton/Consenrich/issues"

[dependency-groups]
cython-sources = [
    "Cython==3.2.5",
    "numpy==2.3.5",
]
test = [
    "pytest",
    "mpmath>=1.3",
    "pysam>=0.23.3",
    "pyBigWig>=0.3.24",
]
docs = [
    "sphinx>=7.3",
    "sphinx-press-theme",
    "furo",
    "myst-parser>=2.0",
    "sphinx_design>=0.6.1",
    "sphinx-autodoc-typehints>=2.1",
    "sphinx-autobuild>=2025.2",
    "sphinx-copybutton>=0.5.0",
    "sphinxcontrib-bibtex>=2.4.0",
]
lint = ["ruff"]
type = ["mypy"]
release = [
    "build",
    "twine",
    "cibuildwheel",
]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "type" },
    { include-group = "release" },
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "consenrich._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
include = ["consenrich", "consenrich.*"]

[tool.setuptools.package-data]
"consenrich.data" = ["*.sizes", "*.json"]

[project.scripts]
consenrich = "consenrich.consenrich:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "correctness: basic tests for correctness",
    "peaks: tests for the built-in ROCCO peak caller",
    "chelpers: tests for the Cython-implemented functions",
    "real_bam: local real-BAM scientific release gate",
]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
test-groups = ["test"]
test-command = """
python -I -c "import numpy as np; import ccounts; import consenrich, consenrich.cconsenrich, consenrich.cuncertainty, consenrich.shrinkState; assert consenrich.__version__ == '0.11.10a0'; weight=np.full(1024,6.0); solved=consenrich.cconsenrich.csolveZeroCenteredBackground(weight,weight,156000149960004.0,False,lamFirst=99920016.0); assert np.array_equal(solved,np.ones(1024))"
"""

[[tool.cibuildwheel.overrides]]
select = "cp315-*"
before-build = "bash {project}/.github/scripts/installHDF5.sh"
before-test = "python -m pip install --no-binary=h5py,numcodecs h5py==3.16.0 numcodecs==0.16.6"
environment = { HDF5_DIR = "/tmp/consenrichHDF5" }
