      cellMetadata: {path: P3.pseudobulks.h5ad, groupColumn: cluster_label1}
    - name: P4
      path: P4.pseudobulks.h5ad
      matrixRows: pseudobulks
      cellMetadata: {path: P4.pseudobulks.h5ad, groupColumn: cluster_label1}
    - name: P6
      path: P6.pseudobulks.h5ad
      matrixRows: pseudobulks
      cellMetadata: {path: P6.pseudobulks.h5ad, groupColumn: cluster_label1}
    - name: P12
      path: P12.pseudobulks.h5ad
      matrixRows: pseudobulks
      cellMetadata: {path: P12.pseudobulks.h5ad, groupColumn: cluster_label1}
    - name: P13
      path: P13.pseudobulks.h5ad
      matrixRows: pseudobulks
      cellMetadata: {path: P13.pseudobulks.h5ad, groupColumn: cluster_label1}
