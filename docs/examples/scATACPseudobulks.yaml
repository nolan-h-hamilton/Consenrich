experimentName: scATACDemo
genomeParams:
  name: hg38
  chromosomes: [chr21, chr22]
countingParams:
  normMethod: CPM
scParams:
  fits:
    - {name: Goblet, selectGroups: [AC_Goblet]}
    - {name: EarlyColonocyte, selectGroups: [Early_Colonocyte]}
    - {name: Colonocyte, selectGroups: [Colonocyte]}
    - {name: BEST4, selectGroups: [BEST4]}
inputParams:
  samples:
    - name: P3
      path: P3.pseudobulks.h5ad
